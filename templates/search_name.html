{% extends "base.html" %}

{% block title %}學生搜尋{% endblock %}

{% block content %}

<div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">學生搜尋</h1>
    <a href="{% url 'index' %}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left"></i> 回首頁
    </a>
</div>

<div class="card">
    <div class="card-body p-4">
        <form action="{% url 'search_list' %}" method="get" class="d-flex gap-2 flex-wrap">
            <div class="input-group" style="max-width: 420px;">
                <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                <input type="text" id="cname" name="cname" class="form-control" placeholder="請輸入姓名 / 電話 / 電子郵件 / 地址等關鍵字">
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-search"></i> 搜尋
            </button>
        </form>
        <div class="form-text mt-2">支援模糊比對，可用空白分隔多個關鍵字（例如：黃 台北）。</div>
    </div>
</div>
{% endblock %}
