<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}學生資料管理系統{% endblock %}</title>
    {% load static %}

    <!-- Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- 輕量現代字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'teacher.css' %}">
</head>
<body>

    <!-- =========================================================
         導覽列
         ========================================================= -->
    <nav class="navbar navbar-expand-md navbar-light app-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'index' %}">
                <i class="bi bi-mortarboard-fill"></i>
                <span>學生資料管理系統</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#appNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="appNavbar">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'index' %}">
                            <i class="bi bi-house-door"></i> 首頁
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'post' %}">
                            <i class="bi bi-person-plus"></i> 新增學生
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'search_name' %}">
                            <i class="bi bi-search"></i> 學生搜尋
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container app-container py-4">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="text-center text-muted small py-4">
        &copy; {% now "Y" %} 學生資料管理系統
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
